name: PTK Authenticated Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ptk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Start application
        run: |
          npm ci
          npm run start:test &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Run authenticated PTK scan
        id: ptk
        uses: ptklabs/ptk-action@v1
        env:
          PTK_SCAN_USERNAME: ${{ secrets.PTK_SCAN_USERNAME }}
          PTK_SCAN_PASSWORD: ${{ secrets.PTK_SCAN_PASSWORD }}
        with:
          target: http://127.0.0.1:3000
          engines: DAST,IAST,SAST,SCA
          fail-on: high
          extra-args: |
            --username-env
            PTK_SCAN_USERNAME
            --password-env
            PTK_SCAN_PASSWORD
            --include-secrets
            --scenario
            test/ptk-login.md

      - name: Upload PTK artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ptk-authenticated-artifacts
          path: ${{ steps.ptk.outputs.output-dir }}
          if-no-files-found: error
